name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # The runner has the Android SDK (ANDROID_HOME), so settings.gradle.kts includes :android.
      - name: Tests, desktop jar and Android APK
        run: ./gradlew :logic:test :lwjgl3:dist :android:assembleDebug --stacktrace

      - name: Screenshot (software OpenGL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p build/screens
          for level in 1 2 3; do
            xvfb-run -a java -jar lwjgl3/build/libs/toothfort-*.jar --level $level --demo --seconds 9 --size 540x1170 --screenshot "$PWD/build/screens/level$level.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macun-kalesi
          path: |
            android/build/outputs/apk/debug/*.apk
            lwjgl3/build/libs/toothfort-*.jar
            build/screens/*.png
          if-no-files-found: error
