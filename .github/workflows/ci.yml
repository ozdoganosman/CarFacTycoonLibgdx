name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # The runner has the Android SDK (ANDROID_HOME), so settings.gradle.kts includes :android.
      - name: Tests, desktop jar and Android APK
        run: ./gradlew :logic:test :lwjgl3:dist :android:assembleDebug --stacktrace

      - name: Screenshots (software OpenGL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p build/screens
          jar=$(ls lwjgl3/build/libs/vektorpilotu-*.jar)
          shot() { xvfb-run -a java -jar "$jar" --size 540x1170 --screenshot "$PWD/build/screens/$1.png" "${@:2}"; }
          shot menu
          shot level1 --level 1
          shot level9 --level 9 --aim-hint
          shot level13 --level 13 --steps 1 --aim-hint
          shot level6-end --level 6 --finish

      - uses: actions/upload-artifact@v4
        with:
          name: vektor-pilotu
          path: |
            android/build/outputs/apk/debug/*.apk
            lwjgl3/build/libs/vektorpilotu-*.jar
            build/screens/*.png
          if-no-files-found: error
